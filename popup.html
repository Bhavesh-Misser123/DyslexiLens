<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f8f9fa; }
    .card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #555; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    
    /* Level Slider */
    .level-slider { width: 100%; margin: 10px 0; }
    .level-labels { display: flex; justify-content: space-between; font-size: 10px; color: #888; }

    /* Theme Circles */
    .theme-grid { display: flex; gap: 8px; }
    .theme-dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .theme-dot.active { border-color: #4a90e2; }

    button { 
      width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      transition: 0.2s; margin-top: 5px;
    }
    .btn-primary { background: #4a90e2; color: white; }
    .btn-ai { background: #8e44ad; color: white; }
    
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 20px; transition: .4s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .4s; }
    input:checked + .slider { background: #4a90e2; }
    input:checked + .slider:before { transform: translateX(14px); }
  </style>
</head>
<body>
  <div class="card">
    <h3>Reading Intelligence</h3>
    <div class="level-labels"><span>Easy</span><span>Medium</span><span>Original</span></div>
    <input type="range" id="readingLevel" class="level-slider" min="0" max="2" value="2">
    <button id="applyLevelBtn" class="btn-ai">✨ Adapt Text Complexity</button>
  </div>

  <div class="card">
    <h3>Visual Assistance</h3>
    <div class="row">
      <span>Focus Spotlight</span>
      <label class="switch"><input type="checkbox" id="focusLock"><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>Word Chunking</span>
      <label class="switch"><input type="checkbox" id="syllables"><span class="slider"></span></label>
    </div>
    <div class="theme-grid">
      <div class="theme-dot" style="background:#ffffff;" data-theme="none"></div>
      <div class="theme-dot" style="background:#fdf6e3;" data-theme="sepia"></div>
      <div class="theme-dot" style="background:#e0f2f1;" data-theme="mint"></div>
      <div class="theme-dot" style="background:#ffe4e1;" data-theme="rose"></div>
    </div>
  </div>

  <div class="card">
    <h3>Insights</h3>
    <button id="summarizeBtn" class="btn-primary">📋 Smart Summary Card</button>
    <button id="readBtn" class="btn-primary" style="background:#27ae60;">🔊 Karaoke Reading</button>
  </div>

  <script src="ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
